name: Release

# Push a tag like v0.6.0 to build static binaries for x86_64 and aarch64,
# sign them keyless with sigstore/cosign (GitHub OIDC), and publish them as
# a GitHub release. scripts/install.sh prefers the cosign signature when
# cosign is available, and falls back to the SHA-256 checksum otherwise.

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write
  # Required for sigstore keyless signing (cosign sign-blob --yes).
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # zig is the C cross-compiler for the bundled SQLite; musl makes the
      # binaries static, so they run on any distribution.
      - name: Install zig and cargo-zigbuild
        run: |
          pip install ziglang
          cargo install --locked cargo-zigbuild

      - name: Build
        run: cargo zigbuild --release --locked --target ${{ matrix.target }} -p rfindd -p rfind-cli

      - name: Package
        run: |
          name=rfind-${{ matrix.arch }}-linux
          mkdir -p $name/bin
          cp target/${{ matrix.target }}/release/rfind target/${{ matrix.target }}/release/rfindd $name/bin/
          cp -r man packaging scripts LICENSE README.md $name/
          tar czf $name.tar.gz $name
          sha256sum $name.tar.gz > $name.tar.gz.sha256

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign tarball with cosign (keyless, sigstore)
        env:
          COSIGN_YES: "true"
        run: |
          name=rfind-${{ matrix.arch }}-linux
          cosign sign-blob --yes \
            --output-signature "$name.tar.gz.sig" \
            --output-certificate "$name.tar.gz.pem" \
            "$name.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: rfind-${{ matrix.arch }}
          path: |
            rfind-${{ matrix.arch }}-linux.tar.gz
            rfind-${{ matrix.arch }}-linux.tar.gz.sha256
            rfind-${{ matrix.arch }}-linux.tar.gz.sig
            rfind-${{ matrix.arch }}-linux.tar.gz.pem

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            rfind-*-linux.tar.gz \
            rfind-*-linux.tar.gz.sha256 \
            rfind-*-linux.tar.gz.sig \
            rfind-*-linux.tar.gz.pem \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
