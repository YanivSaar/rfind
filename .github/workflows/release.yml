name: Release

# Push a tag like v0.6.0 to build static binaries for x86_64 and aarch64,
# sign them keyless with sigstore/cosign (GitHub OIDC), and publish them as
# a GitHub release. scripts/install.sh prefers the cosign signature when
# cosign is available, and falls back to the SHA-256 checksum otherwise.

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write
  # Required for sigstore keyless signing (cosign sign-blob --yes).
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.arch }}-${{ matrix.libc }}
    runs-on: ubuntu-latest
    # riscv64 is experimental: let it fail the job without failing
    # the whole matrix. x86_64/aarch64 (musl + gnu) stay required.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl builds — portable across every glibc version
          # and every distro, including Alpine. The default downloads
          # for users on install.sh.
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            libc: musl
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            libc: musl
          # glibc dynamic builds — for RHEL-FIPS / Ubuntu Pro users
          # who need to link the distro's crypto-wrapped libsqlite3
          # against a dynamic binary. Smaller runtime image on
          # systems that already have glibc + libstdc++. Named with
          # the libc suffix so install.sh and air-gapped bundles
          # pick the right one explicitly.
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            libc: gnu
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            libc: gnu
          # RISC-V 64-bit (gnu only — no production musl toolchain
          # for riscv64 under cargo-zigbuild as of 1.10). Marked
          # continue-on-error below because riscv64 is a tier-2
          # Rust target and a single transient failure shouldn't
          # fail the whole release.
          - arch: riscv64
            target: riscv64gc-unknown-linux-gnu
            libc: gnu
            experimental: true
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # zig is the C cross-compiler for the bundled SQLite; musl makes the
      # binaries static, so they run on any distribution.
      - name: Install zig and cargo-zigbuild
        run: |
          pip install ziglang
          cargo install --locked cargo-zigbuild

      - name: Build
        run: cargo zigbuild --release --locked --target ${{ matrix.target }} -p rfindd -p rfind-cli

      # CycloneDX SBOM covers every crate that compiled into the release
      # binaries, with version and license per entry. Attached alongside
      # the tarball so downstream consumers (distros, SCA tooling) can
      # match the shipped bits against an upstream advisory feed.
      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx

      - name: Package
        run: |
          # Artifact naming:
          #   rfind-<arch>-linux.tar.gz          (musl, portable; keeps the
          #                                       existing name for backwards
          #                                       compatibility with install.sh)
          #   rfind-<arch>-linux-gnu.tar.gz      (glibc dynamic)
          if [ "${{ matrix.libc }}" = "gnu" ]; then
            name=rfind-${{ matrix.arch }}-linux-gnu
          else
            name=rfind-${{ matrix.arch }}-linux
          fi
          echo "ARTIFACT_NAME=$name" >> "$GITHUB_ENV"
          mkdir -p $name/bin
          cp target/${{ matrix.target }}/release/rfind \
             target/${{ matrix.target }}/release/rfindd $name/bin/
          cp -r man packaging scripts LICENSE README.md $name/
          # cargo-cyclonedx walks the entire workspace by itself; -p is
          # not a flag it accepts. It writes <crate>.cdx.json next to
          # each crate's Cargo.toml. We then merge the two shipped crates
          # (daemon + CLI) into one workspace SBOM.
          cargo cyclonedx --format json --target ${{ matrix.target }}
          # cargo-cyclonedx names its output after the package name, not
          # the binary name. The CLI's package is `rfind-cli` even though
          # the shipped binary is `rfind`.
          jq -s '{bomFormat:"CycloneDX", specVersion:"1.5", components: (map(.components) | add | unique_by(.["bom-ref"]))}' \
            crates/rfindd/rfindd.cdx.json crates/rfind-cli/rfind-cli.cdx.json \
            > $name.cdx.json
          tar czf $name.tar.gz $name
          sha256sum $name.tar.gz > $name.tar.gz.sha256
          sha256sum $name.cdx.json > $name.cdx.json.sha256

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign tarball and SBOM with cosign (keyless, sigstore)
        env:
          COSIGN_YES: "true"
        run: |
          name=$ARTIFACT_NAME
          cosign sign-blob --yes \
            --output-signature "$name.tar.gz.sig" \
            --output-certificate "$name.tar.gz.pem" \
            "$name.tar.gz"
          cosign sign-blob --yes \
            --output-signature "$name.cdx.json.sig" \
            --output-certificate "$name.cdx.json.pem" \
            "$name.cdx.json"

      - uses: actions/upload-artifact@v7
        with:
          name: rfind-${{ matrix.arch }}-${{ matrix.libc }}
          # The matrix row sets ARTIFACT_NAME above; expand it here
          # via the shell to cover both `rfind-<arch>-linux*` (musl)
          # and `rfind-<arch>-linux-gnu*` (glibc) patterns.
          path: |
            ${{ env.ARTIFACT_NAME }}.tar.gz
            ${{ env.ARTIFACT_NAME }}.tar.gz.sha256
            ${{ env.ARTIFACT_NAME }}.tar.gz.sig
            ${{ env.ARTIFACT_NAME }}.tar.gz.pem
            ${{ env.ARTIFACT_NAME }}.cdx.json
            ${{ env.ARTIFACT_NAME }}.cdx.json.sha256
            ${{ env.ARTIFACT_NAME }}.cdx.json.sig
            ${{ env.ARTIFACT_NAME }}.cdx.json.pem

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Globs include an optional `-gnu` suffix so both the musl
          # (`rfind-x86_64-linux.tar.gz`) and glibc dynamic
          # (`rfind-x86_64-linux-gnu.tar.gz`) artifacts upload.
          gh release create "${{ github.ref_name }}" \
            rfind-*-linux*.tar.gz \
            rfind-*-linux*.tar.gz.sha256 \
            rfind-*-linux*.tar.gz.sig \
            rfind-*-linux*.tar.gz.pem \
            rfind-*-linux*.cdx.json \
            rfind-*-linux*.cdx.json.sha256 \
            rfind-*-linux*.cdx.json.sig \
            rfind-*-linux*.cdx.json.pem \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
