name: Fuzz (nightly smoke)

on:
  schedule:
    - cron: '27 4 * * *'  # 04:27 UTC every day
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    name: cargo-fuzz 60s per target
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_zvfs_record
          - fuzz_zvfs_roundtrip
          - fuzz_fanotify_event
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run ${{ matrix.target }} for 60s
        working-directory: fuzz
        run: |
          set -o pipefail
          # Pass the committed seeds corpus explicitly so libFuzzer starts
          # from known-interesting inputs instead of /dev/urandom bytes.
          cargo +nightly fuzz run ${{ matrix.target }} \
            corpus/${{ matrix.target }} \
            seeds/${{ matrix.target }} \
            -- -max_total_time=60 2>&1 | tee ../fuzz-${{ matrix.target }}.log

      - name: Upload fuzz log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-log
          path: fuzz-${{ matrix.target }}.log
          if-no-files-found: ignore

      - name: Upload crash artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-crashes
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
