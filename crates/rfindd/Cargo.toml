[package]
name = "rfindd"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rfindd"
path = "src/main.rs"

[dependencies]
rfind-core = { path = "../rfind-core" }
rfind-scanner = { path = "../rfind-scanner" }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
