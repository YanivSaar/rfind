[package]
name = "rfindd"
version = "1.5.1"
edition = "2021"

[[bin]]
name = "rfindd"
path = "src/main.rs"

[dependencies]
num_cpus = "1"
libc = "0.2"
rfind-core    = { path = "../rfind-core" }
rfind-config  = { path = "../rfind-config" }
rfind-scanner = { path = "../rfind-scanner" }
rfind-monitor = { path = "../rfind-monitor" }
serde_json    = "1"
serde = { version = "1", features = ["derive"] }
tracing       = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror     = "2"
rusqlite      = { version = "0.40", features = ["bundled"] }
signal-hook   = "0.4"

[dev-dependencies]
tempfile = "3"
