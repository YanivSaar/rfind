[package]
name = "rfind-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rfind"
path = "src/main.rs"

[dependencies]
rfind-core = { path = "../rfind-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
