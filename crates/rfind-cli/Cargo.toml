[package]
name = "rfind-cli"
version = "0.6.0"
edition = "2021"

[[bin]]
name = "rfind"
path = "src/main.rs"

[dependencies]
libc = "0.2"
rfind-core   = { path = "../rfind-core" }
rfind-config = { path = "../rfind-config" }
clap         = { version = "4", features = ["derive"] }
serde_json   = "1"
rusqlite     = { version = "0.32", features = ["bundled"] }
chrono       = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap_complete = "4"
serde = { version = "1.0.229", features = ["derive"] }
