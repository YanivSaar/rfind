[package]
name = "rfind-core"
version = "1.8.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
regex-lite = "0.1"
rfind-zvfs = { path = "../rfind-zvfs" }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
