# credentials.toml — keys, keyrings, cloud creds, password managers.
#
# File-name leakage: a key named id_ed25519_prod_frankfurt or a pass
# entry banking/chase.gpg says a lot even without the file contents.
#
# Paste the paths below into `scan.exclude` in /etc/rfindd/config.toml.

[scan]
exclude = [
  # SSH
  "/root/.ssh",
  "/home/alice/.ssh",

  # GPG / keyring
  "/root/.gnupg",
  "/home/alice/.gnupg",
  "/home/alice/.local/share/keyrings",
  "/home/alice/.config/keyringer",

  # Cloud credentials
  "/root/.aws",
  "/home/alice/.aws",
  "/root/.config/gcloud",
  "/home/alice/.config/gcloud",
  "/root/.azure",
  "/home/alice/.azure",
  "/root/.kube",
  "/home/alice/.kube",

  # Password managers
  "/home/alice/.password-store",
  "/home/alice/.config/pass",
  "/home/alice/.config/Bitwarden",
  "/home/alice/.config/1Password",
]
